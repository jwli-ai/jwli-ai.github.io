<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jwli - Home</title>
    <style>
        /* 基础样式复刻与布局优化 */
        body {
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            color: #000;
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
        }

        /* 左侧导航栏 */
        .sidebar {
            width: 150px;
            flex-shrink: 0;
            padding-right: 20px;
            border-right: 1px solid #e0e0e0;
        }
        .site-title {
            font-size: 18px;
            font-weight: bold;
            color: #3b5998;
            text-decoration: none;
            display: block;
            margin-bottom: 25px;
        }
        .nav-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .nav-links li {
            margin-bottom: 8px;
        }
        .nav-links a {
            color: #3b5998;
            text-decoration: none;
            font-size: 13px;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }

        /* 右侧主要内容区域（修复挤压错位） */
        .main-content {
            flex-grow: 1;
            padding-left: 40px;
            display: flex;
            flex-direction: column; /* 强制定向为上下垂直排列，防止内容左右挤压 */
        }
        
        /* 顶部大标题 */
        .page-title {
            font-size: 22px;
            font-weight: bold;
            color: #3b5998;
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* 修复后的研究兴趣板块 */
        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #3b5998;
            border-bottom: 2px solid #3b5998;
            padding-bottom: 3px;
            margin-top: 20px;
            margin-bottom: 15px;
            width: 100%; /* 确保分隔线撑满右侧区域 */
        }

        .content-text {
            font-size: 13px;
            margin: 0 0 10px 0;
            max-width: 800px;
        }

        .interest-list {
            margin: 0;
            padding-left: 20px;
        }
        .interest-list li {
            margin-bottom: 6px;
            font-size: 13px;
            list-style-type: square; /* 保持图中经典的正方形小列表标点 */
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 左侧导航栏 -->
        <aside class="sidebar">
            <a href="#" class="site-title">jwli</a>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Group</a></li>
                <li><a href="#">Teaching</a></li>
                <li><a href="#">Service</a></li>
                <li><a href="#">Research</a></li>
                <li><a href="#">Publications</a></li>
                <li><a href="#">Codes & Data</a></li>
                <li><a href="#">Awards & honours</a></li>
            </ul>
        </aside>

        <!-- 右侧内容区 -->
        <main class="main-content">
            <h1 class="page-title">Home</h1>
            <p>Contact: jwli18@126.com</p>

            <!-- 研究兴趣板块（已重构，完美对齐） -->
            <h3 class="section-title">Research Interests</h3>
            
            <ul class="interest-list">
                <li>explainable artificial intelligence</li>
                <li>multi-modality learning</li>
                <li>AI for science</li>
            </ul>

        </main>
    </div>

</body>
</html>
